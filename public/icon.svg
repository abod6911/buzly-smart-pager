<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#16161D" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </radialGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#bgGlow)" />
  <rect width="510" height="510" x="1" y="1" rx="127" fill="none" stroke="#23232C" stroke-width="2" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#10B981" stroke-opacity="0.2" stroke-width="8" />

  <!-- Bell Symbol with Glow -->
  <g transform="translate(128, 120) scale(1.0)" filter="url(#glow)">
    <path d="M128 32 C75 32 32 75 32 128 L32 192 L16 224 L16 240 L240 240 L240 224 L224 192 L224 128 C224 75 181 32 128 32 Z" fill="url(#emeraldGrad)" />
    <circle cx="128" cy="24" r="16" fill="url(#emeraldGrad)" />
    <path d="M104 256 C104 269 115 280 128 280 C141 280 152 269 152 256 Z" fill="#34D399" />
  </g>
</svg>
